# save_to_clipboard = true
# "window.dynamic_title" = true
# window_opacity = 0.8

live_config_reload = true

[colors]
draw_bold_text_with_bright_colors = true

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
chars = '''
 printf "\033c"
'''
key = "K"
mods = "Control"

[colors.bright]
black = "0x405860"
blue = "0x6699cc"
cyan = "0x5fb3b3"
green = "0x99c794"
magenta = "0xc594c5"
red = "0xec5f67"
white = "0xadb5c0"
yellow = "0xfac863"

[colors.normal]
black = "0x29414f"
blue = "0x6699cc"
cyan = "0x5fb3b3"
green = "0x99c794"
magenta = "0xc594c5"
red = "0xec5f67"
white = "0x65737e"
yellow = "0xfac863"

[colors.primary]
background = "0x000000"
foreground = "0xd8dee9"

[cursor]
style = "Underline"

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.bold]
family = "Monospace"

[font.bold_italic]
family = "Monospace"
# size = 9.0

[font.italic]
family = "Monospace"

[font.normal]
family = "Monospace"

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[terminal.shell]
args = ["--login"]
program = "/usr/bin/zsh"

[window]
decorations = "full"
dynamic_padding = true
# gtk_theme_variant = "dark"
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[keyboard]
